name: Bootstrap LingoLanka source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v6
      - name: Restore verified project snapshot
        shell: bash
        run: |
          shopt -s dotglob
          for path in *; do
            if [ "$path" != ".git" ] && [ "$path" != ".github" ]; then rm -rf -- "$path"; fi
          done
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf -- {} +
          printf '%s' '' | base64 --decode > /tmp/lingolanka-source.tar.gz
          tar --exclude='.github/workflows' --exclude='.github/workflows/*' -xzf /tmp/lingolanka-source.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete LingoLanka application"
          git push
